<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chức năng 20: Thanh toán viện phí - makePayment()</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav-container"></div>

  <main class="page-container">
    <div id="banner-container"></div>

    <div class="grid-2">
      <div class="card">
        <h2 class="card-title">💳 Lập Phiếu Thu & Thanh Toán Viện Phí</h2>
        <form id="paymentForm" onsubmit="handlePaymentSubmit(event)">
          <div class="form-group">
            <label class="form-label">Chọn Bệnh nhân thanh toán (*)</label>
            <select id="payPatientSelect" class="form-control" required></select>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Tổng chi phí (VNĐ) (*)</label>
              <input type="number" id="payTotalAmount" class="form-control" placeholder="1000000" min="0" step="10000" required oninput="calcNetAndDebt()">
            </div>
            <div class="form-group">
              <label class="form-label">Giảm giá / Voucher (VNĐ)</label>
              <input type="number" id="payDiscount" class="form-control" value="0" min="0" step="10000" oninput="calcNetAndDebt()">
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Số tiền thực nộp kỳ này (VNĐ) (*)</label>
              <input type="number" id="payAmountPaid" class="form-control" placeholder="1000000" min="0" step="10000" required oninput="calcNetAndDebt()">
            </div>
            <div class="form-group">
              <label class="form-label">Còn nợ / Còn thiếu:</label>
              <div id="payDebtDisplay" style="font-size:1.15rem; font-weight:700; color:#dc2626; margin-top:8px;">0 đ</div>
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Hình thức thanh toán</label>
              <select id="payMethod" class="form-control">
                <option value="Chuyển khoản QR">Chuyển khoản VietQR</option>
                <option value="Tiền mặt">Tiền mặt tại quầy</option>
                <option value="Thẻ tín dụng / POS">Thẻ tín dụng / Thẻ ATM (POS)</option>
                <option value="Trả góp lãi suất 0%">Trả góp nha khoa lãi suất 0%</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Thu ngân / Người thu tiền</label>
              <input type="text" id="payCashier" class="form-control" value="Lễ tân Nguyễn Ngọc">
            </div>
          </div>

          <button type="submit" class="btn btn-success btn-block">
            <span>💳 Thực thi makePayment()</span>
          </button>
        </form>
      </div>

      <div class="card">
        <h2 class="card-title">🧾 Lịch Sử Các Hóa Đơn Đã Thanh Toán</h2>
        <div id="paymentsHistoryList" style="display:flex; flex-direction:column; gap:12px; max-height:550px; overflow-y:auto;"></div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/20-make-payment.js"></script>
</body>
</html>
