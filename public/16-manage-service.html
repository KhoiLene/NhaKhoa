<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chức năng 16: Quản lý dịch vụ - add/update/deleteService()</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav-container"></div>

  <main class="page-container">
    <div id="banner-container"></div>

    <div class="card" style="padding:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <h3 style="margin:0;">Bảng Giá Dịch Vụ Nha Khoa Toàn Diện</h3>
        <button class="btn btn-primary" onclick="openAddServiceModal()">
          <span>➕ Thêm Dịch Vụ Mới</span>
        </button>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã DV</th>
              <th>Tên Dịch Vụ</th>
              <th>Đơn giá</th>
              <th>Đơn vị tính</th>
              <th>Chế độ Bảo hành</th>
              <th>Mô tả chi tiết</th>
              <th style="text-align:right;">Thao tác</th>
            </tr>
          </thead>
          <tbody id="servicesTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Service Modal -->
    <div id="serviceModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; align-items:center; justify-content:center;">
      <div class="card" style="width:100%; max-width:550px; margin:20px;">
        <h3 id="modalSrvTitle" class="card-title">Thêm Dịch Vụ Mới</h3>
        <form id="serviceForm" onsubmit="handleServiceFormSubmit(event)">
          <input type="hidden" id="modalSrvId">
          <div class="form-group">
            <label class="form-label">Tên dịch vụ nha khoa (*)</label>
            <input type="text" id="modalSrvName" class="form-control" placeholder="Trám răng, Cấy Implant, Tẩy trắng..." required>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Đơn giá (VNĐ) (*)</label>
              <input type="number" id="modalSrvPrice" class="form-control" placeholder="500000" min="0" step="10000" required>
            </div>
            <div class="form-group">
              <label class="form-label">Đơn vị tính</label>
              <input type="text" id="modalSrvUnit" class="form-control" placeholder="Răng, Liệu trình, Hàm..." value="Răng" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Chế độ bảo hành</label>
            <input type="text" id="modalSrvWarranty" class="form-control" placeholder="12 tháng, 5 năm, Trọn đời...">
          </div>
          <div class="form-group">
            <label class="form-label">Mô tả quy trình kỹ thuật</label>
            <textarea id="modalSrvDesc" class="form-control" rows="2"></textarea>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
            <button type="button" class="btn btn-secondary" onclick="closeServiceModal()">Hủy</button>
            <button type="submit" class="btn btn-primary">Lưu Dịch Vụ</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/16-manage-service.js"></script>
</body>
</html>
