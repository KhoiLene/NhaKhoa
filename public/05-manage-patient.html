<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chức năng 5: Quản lý bệnh nhân - add/update/delete/searchPatient()</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav-container"></div>

  <main class="page-container">
    <div id="banner-container"></div>

    <div class="card" style="padding:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div style="display:flex; gap:10px; flex:1; max-width:500px;">
          <input type="text" id="patientSearchInput" class="form-control" placeholder="🔍 Tìm kiếm theo tên, SĐT, mã BN..." oninput="handleSearchPatient()">
          <button class="btn btn-secondary btn-sm" onclick="handleSearchPatient()">Tìm kiếm</button>
        </div>
        <button class="btn btn-primary" onclick="openAddPatientModal()">
          <span>➕ Thêm Bệnh nhân Mới</span>
        </button>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">
        <span>Danh sách Hồ sơ Bệnh nhân</span>
        <span id="patientCountBadge" class="status-pill status-received">0 bệnh nhân</span>
      </h2>

      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã BN</th>
              <th>Họ và Tên</th>
              <th>Số điện thoại</th>
              <th>Ngày sinh</th>
              <th>Giới tính</th>
              <th>Tiền sử bệnh</th>
              <th>Địa chỉ</th>
              <th style="text-align:right;">Hành động</th>
            </tr>
          </thead>
          <tbody id="patientTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Add / Edit Patient Modal -->
    <div id="patientModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; align-items:center; justify-content:center;">
      <div class="card" style="width:100%; max-width:600px; margin:20px; max-height:90vh; overflow-y:auto;">
        <h2 id="modalTitle" class="card-title">Thêm Bệnh nhân Mới</h2>
        <form id="patientForm" onsubmit="handlePatientFormSubmit(event)">
          <input type="hidden" id="modalPatientId">
          <div class="form-group">
            <label class="form-label">Họ và tên (*)</label>
            <input type="text" id="modalName" class="form-control" required>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Số điện thoại (*)</label>
              <input type="tel" id="modalPhone" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" id="modalEmail" class="form-control">
            </div>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Ngày sinh</label>
              <input type="date" id="modalDob" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label">Giới tính</label>
              <select id="modalGender" class="form-control">
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
                <option value="Khác">Khác</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Địa chỉ</label>
            <input type="text" id="modalAddress" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">Tiền sử bệnh lý</label>
            <textarea id="modalMedicalHistory" class="form-control" rows="2"></textarea>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
            <button type="button" class="btn btn-secondary" onclick="closePatientModal()">Hủy</button>
            <button type="submit" class="btn btn-primary" id="btnSavePatient">Lưu dữ liệu</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/05-manage-patient.js"></script>
</body>
</html>
