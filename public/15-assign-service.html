<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chức năng 15: Chỉ định dịch vụ - assignService()</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav-container"></div>

  <main class="page-container">
    <div id="banner-container"></div>

    <div class="grid-2">
      <div class="card">
        <h2 class="card-title">💉 Phiếu Chỉ Định Dịch Vụ Nha Khoa</h2>
        <form id="assignServiceForm" onsubmit="handleAssignSubmit(event)">
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Chọn Bệnh nhân (*)</label>
              <select id="assignPatientSelect" class="form-control" required></select>
            </div>
            <div class="form-group">
              <label class="form-label">Bác sĩ chỉ định (*)</label>
              <select id="assignDoctorSelect" class="form-control" required></select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Chọn các Dịch vụ chỉ định thực hiện:</label>
            <div id="servicesCheckboxList" style="max-height:280px; overflow-y:auto; border:1px solid #e2e8f0; border-radius:8px; padding:12px; background:#f8fafc;"></div>
          </div>

          <div style="background:#f0fdfa; border:1px solid #99f6e4; padding:14px; border-radius:8px; margin-bottom:16px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-weight:600;">Tổng tiền dịch vụ chỉ định:</span>
              <strong id="assignTotalDisplay" style="font-size:1.3rem; color:var(--primary-dark);">0 đ</strong>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            <span>💉 Thực thi assignService()</span>
          </button>
        </form>
      </div>

      <div class="card">
        <h2 class="card-title">📋 Danh sách Phiếu Chỉ Định Gần Đây</h2>
        <div id="assignedListContainer" style="display:flex; flex-direction:column; gap:12px; max-height:550px; overflow-y:auto;"></div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/15-assign-service.js"></script>
</body>
</html>
