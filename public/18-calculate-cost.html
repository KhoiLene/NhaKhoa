<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chức năng 18: Báo giá chi phí - calculateCost()</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav-container"></div>

  <main class="page-container">
    <div id="banner-container"></div>

    <div class="grid-2">
      <div class="card">
        <h2 class="card-title">💰 Công Cụ Báo Giá Chi Phí Điều Trị</h2>
        <form id="calculateCostForm" onsubmit="handleCalculateSubmit(event)">
          <div class="form-group">
            <label class="form-label">Chọn danh sách Dịch vụ cần tính giá:</label>
            <div id="costServicesList" style="max-height:240px; overflow-y:auto; border:1px solid #e2e8f0; border-radius:8px; padding:12px; background:#f8fafc;"></div>
          </div>

          <div class="grid-3">
            <div class="form-group">
              <label class="form-label">Chiết khấu (%)</label>
              <input type="number" id="costDiscountPercent" class="form-control" value="5" min="0" max="100">
            </div>
            <div class="form-group">
              <label class="form-label">Giảm trực tiếp (VNĐ)</label>
              <input type="number" id="costDiscountAmount" class="form-control" value="0" min="0" step="50000">
            </div>
            <div class="form-group">
              <label class="form-label">Bảo hiểm chi trả (%)</label>
              <input type="number" id="costInsurancePercent" class="form-control" value="0" min="0" max="100">
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            <span>🧮 Thực thi calculateCost()</span>
          </button>
        </form>
      </div>

      <div class="card">
        <h2 class="card-title">🧾 Bảng Báo Giá Chi Tiết & Tạm Tính</h2>
        <div id="costResultContainer">
          <p style="color:#64748b;">Vui lòng chọn dịch vụ và bấm "Thực thi calculateCost()" để xem bảng bóc tách chi phí.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/18-calculate-cost.js"></script>
</body>
</html>
